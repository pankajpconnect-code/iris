    - generic [ref=f5e108]: GoCardless Payments
    - generic [ref=f5e109]: "# 👋 Introduction Documentation for how to use this collection, including a Quickstart guide, is available on the [GoCardless Developer Docs](https://developer.gocardless.com/getting-started/introduction). Detailed documentation for GoCardless API endpoints is at the [GoCardless API reference guide](https://developer.gocardless.com/api-reference/). ## 📝 Prerequisites [Postman](https://www.getpostman.com/downloads/) [GoCardless Account](https://manage-sandbox.gocardless.com/) Before you begin, set up your free GoCardless Sandbox account. Here, you can create an access token to add to your forked Postman collection. ## 🏃 Getting Started 1\\. Create a GoCardless Sandbox account [here](https://manage-sandbox.gocardless.com/sign-up): the sandbox is our dedicated testing environment where you can build and test your integration without touching real money. 2\\. Go to [Developers &gt; Create &gt; Access Token](https://manage-sandbox.gocardless.com/developers/access-tokens/create) to generate an API access token. Give it a memorable name, with read-write access. <img src=\"https://content.pstmn.io/0dfaf33e-fbff-4ba9-836a-3ba2da42734f/MjAyMy4wNy4yMSBhdCAxNC40Ny4wOEAyeC5wbmc=\" alt=\"Creating%20a%20new%20access%20token\" width=\"270\" height=\"163\"> 3\\. [Fork](https://www.postman.com/gocardlessapi/workspace/gocardless-api/collection/22460459-bae9db02-4aec-428e-bbe4-c36d6d199fd0/fork?origin=tab) the collection into Postman to synchronize with future updates. <img src=\"https://content.pstmn.io/6fe085d7-eee3-4af4-9090-3aa7e15a9e09/MjAyMy4wMS4xNyBhdCAxNi4xOS40M0AyeC5wbmc=\" width=\"422\" height=\"458\"> 4\\. Set up a [Postman Environment](https://learning.postman.com/docs/sending-requests/managing-environments/) for the GoCardless API collection by navigating to Environments and selecting the + icon to create a new environment. <img src=\"https://content.pstmn.io/f6aa7ce1-78d4-4042-becd-25331e63739d/aW1hZ2UucG5n\" alt=\"Creating%20a%20new%20Environment%20to%20store%20collection%20data\" width=\"330\" height=\"375\"> 5\\. Navigate to an API call you'd like to test to save your key into the collection: - With an API call open, click into \"Authorization\" - Expand the section - Paste in Copy the access token from _step 2_. - \"Save authorization to collection\" with the link <img src=\"https://content.pstmn.io/68f58aae-7057-44ec-b877-62d23dac4205/aW1hZ2UucG5n\" alt=\"Save%20token%20to%20your%20Postman%20collection%20to%20execute%20calls\" width=\"1608\" height=\"746\"> # Things to Note 1. There are often additional URL parameters or various request bodies that can be passed, we recommended going through our API Developer Guide [here](https://developer.gocardless.com/api-reference/#core-endpoints) and amending the requests as necessary. 2. The Bank Account field requirements will vary depending on the scheme and payment method - please update the relevant requests accordingly. See more info [here](https://developer.gocardless.com/api-reference/#appendix-local-bank-details). 3. Our requests are chained together automatically via Environment variables, so there is no need to copy & paste IDs across requests. 4. Enjoy! 🥳"
