          - text: ": the sandbox is our dedicated testing environment where you can build and test your integration without touching real money."
        - paragraph [ref=f2e935]:
          - text: 2\. Go to
          - link "Developers > Create > Access Token" [ref=f2e936] [cursor=pointer]:
            - /url: https://manage-sandbox.gocardless.com/developers/access-tokens/create
          - text: to generate an API access token. Give it a memorable name, with read-write access.
        - paragraph [ref=f2e937]:
          - img "Creating a new access token" [ref=f2e938]
        - paragraph [ref=f2e939]:
          - text: 3\.
          - link "Fork" [ref=f2e940] [cursor=pointer]:
            - /url: https://www.postman.com/gocardlessapi/workspace/gocardless-api/collection/22460459-bae9db02-4aec-428e-bbe4-c36d6d199fd0/fork?origin=tab
          - text: the collection into Postman to synchronize with future updates.
        - paragraph [ref=f2e941]
        - paragraph [ref=f2e942]:
          - text: 4\. Set up a
          - link "Postman Environment" [ref=f2e943] [cursor=pointer]:
            - /url: https://learning.postman.com/docs/sending-requests/managing-environments/
          - text: for the GoCardless API collection by navigating to Environments and selecting the + icon to create a new environment.
        - paragraph [ref=f2e944]:
          - img "Creating a new Environment to store collection data" [ref=f2e945]
        - paragraph [ref=f2e946]: "5\\. Navigate to an API call you'd like to test to save your key into the collection:"
        - paragraph [ref=f2e947]: "- With an API call open, click into \"Authorization\" - Expand the section - Paste in Copy the access token from _step 2_. - \"Save authorization to collection\" with the link"
        - paragraph [ref=f2e948]:
          - img "Save token to your Postman collection to execute calls" [ref=f2e949]
        - heading "Things to Note" [level=1] [ref=f2e950]
        - paragraph [ref=f2e951]:
          - text: 1. There are often additional URL parameters or various request bodies that can be passed, we recommended going through our API Developer Guide
          - link "here" [ref=f2e952] [cursor=pointer]:
            - /url: https://developer.gocardless.com/api-reference/#core-endpoints
          - text: and amending the requests as necessary. 2. The Bank Account field requirements will vary depending on the scheme and payment method - please update the relevant requests accordingly. See more info
          - link "here" [ref=f2e953] [cursor=pointer]:
            - /url: https://developer.gocardless.com/api-reference/#appendix-local-bank-details
          - text: . 3. Our requests are chained together automatically via Environment variables, so there is no need to copy & paste IDs across requests. 4. Enjoy! 🥳
