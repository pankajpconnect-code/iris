        - heading "👋 Introduction" [level=1] [ref=e921]
        - paragraph [ref=e922]:
          - text: Documentation for how to use this collection, including a Quickstart guide, is available on the
          - link "GoCardless Developer Docs" [ref=e923] [cursor=pointer]:
            - /url: https://developer.gocardless.com/getting-started/introduction
          - text: .
        - paragraph [ref=e924]:
          - text: Detailed documentation for GoCardless API endpoints is at the
          - link "GoCardless API reference guide" [ref=e925] [cursor=pointer]:
            - /url: https://developer.gocardless.com/api-reference/
          - text: .
        - heading "📝 Prerequisites" [level=2] [ref=e926]
        - paragraph [ref=e927]:
          - link "Postman" [ref=e928] [cursor=pointer]:
            - /url: https://www.getpostman.com/downloads/
          - link "GoCardless Account" [ref=e929] [cursor=pointer]:
            - /url: https://manage-sandbox.gocardless.com/
        - paragraph [ref=e930]: Before you begin, set up your free GoCardless Sandbox account. Here, you can create an access token to add to your forked Postman collection.
        - heading "🏃 Getting Started" [level=2] [ref=e931]
        - paragraph [ref=e932]:
          - text: 1\. Create a GoCardless Sandbox account
          - link "here" [ref=e933] [cursor=pointer]:
            - /url: https://manage-sandbox.gocardless.com/sign-up
          - text: ": the sandbox is our dedicated testing environment where you can build and test your integration without touching real money."
        - paragraph [ref=e934]:
          - text: 2\. Go to
          - link "Developers > Create > Access Token" [ref=e935] [cursor=pointer]:
            - /url: https://manage-sandbox.gocardless.com/developers/access-tokens/create
          - text: to generate an API access token. Give it a memorable name, with read-write access.
        - paragraph [ref=e936]:
          - img "Creating a new access token" [ref=e937]
        - paragraph [ref=e938]:
          - text: 3\.
          - link "Fork" [ref=e939] [cursor=pointer]:
            - /url: https://www.postman.com/gocardlessapi/workspace/gocardless-api/collection/22460459-bae9db02-4aec-428e-bbe4-c36d6d199fd0/fork?origin=tab
          - text: the collection into Postman to synchronize with future updates.
        - paragraph [ref=e940]
        - paragraph [ref=e941]:
          - text: 4\. Set up a
          - link "Postman Environment" [ref=e942] [cursor=pointer]:
            - /url: https://learning.postman.com/docs/sending-requests/managing-environments/
          - text: for the GoCardless API collection by navigating to Environments and selecting the + icon to create a new environment.
        - paragraph [ref=e943]:
          - img "Creating a new Environment to store collection data" [ref=e944]
        - paragraph [ref=e945]: "5\\. Navigate to an API call you'd like to test to save your key into the collection:"
        - list [ref=e946]:
          - listitem [ref=e947]: With an API call open, click into "Authorization"
        - list [ref=e948]:
          - listitem [ref=e949]: Expand the section
        - list [ref=e950]:
          - listitem [ref=e951]: Paste in Copy the access token from _step 2_.
        - list [ref=e952]:
          - listitem [ref=e953]: "\"Save authorization to collection\" with the link"
        - paragraph [ref=e954]:
          - img "Save token to your Postman collection to execute calls" [ref=e955]
        - heading "Things to Note" [level=1] [ref=e956]
        - paragraph [ref=e957]:
          - text: 1. There are often additional URL parameters or various request bodies that can be passed, we recommended going through our API Developer Guide
          - link "here" [ref=e958] [cursor=pointer]:
            - /url: https://developer.gocardless.com/api-reference/#core-endpoints
          - text: and amending the requests as necessary.
        - paragraph [ref=e959]:
          - text: 2. The Bank Account field requirements will vary depending on the scheme and payment method - please update the relevant requests accordingly. See more info
          - link "here" [ref=e960] [cursor=pointer]:
            - /url: https://developer.gocardless.com/api-reference/#appendix-local-bank-details
          - text: .
        - paragraph [ref=e961]: 3. Our requests are chained together automatically via Environment variables, so there is no need to copy & paste IDs across requests.
        - paragraph [ref=e962]: 4. Enjoy! 🥳
