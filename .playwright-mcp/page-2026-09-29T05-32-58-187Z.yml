        - paragraph [ref=e931]: Before you begin, set up your free GoCardless Sandbox account. Here, you can create an access token to add to your forked Postman collection.
        - heading "🏃 Getting Started" [level=2] [ref=e932]
        - paragraph [ref=e933]:
          - text: 1\. Create a GoCardless Sandbox account
          - link "here" [ref=e934] [cursor=pointer]:
            - /url: https://manage-sandbox.gocardless.com/sign-up
          - text: ": the sandbox is our dedicated testing environment where you can build and test your integration without touching real money."
        - paragraph [ref=e935]:
          - text: 2\. Go to
          - link "Developers &gt; Create &gt; Access Token" [ref=e936] [cursor=pointer]:
            - /url: https://manage-sandbox.gocardless.com/developers/access-tokens/create
          - text: to generate an API access token. Give it a memorable name, with read-write access.
        - paragraph [ref=e937]: <img src="https://content.pstmn.io/0dfaf33e-fbff-4ba9-836a-3ba2da42734f/MjAyMy4wNy4yMSBhdCAxNC40Ny4wOEAyeC5wbmc=" alt="Creating%20a%20new%20access%20token" width="270" height="163">
        - paragraph [ref=e938]:
          - text: 3\.
          - link "Fork" [ref=e939] [cursor=pointer]:
            - /url: https://www.postman.com/gocardlessapi/workspace/gocardless-api/collection/22460459-bae9db02-4aec-428e-bbe4-c36d6d199fd0/fork?origin=tab
          - text: the collection into Postman to synchronize with future updates.
        - paragraph [ref=e940]: <img src="https://content.pstmn.io/6fe085d7-eee3-4af4-9090-3aa7e15a9e09/MjAyMy4wMS4xNyBhdCAxNi4xOS40M0AyeC5wbmc=" width="422" height="458">
        - paragraph [ref=e941]:
          - text: 4\. Set up a
          - link "Postman Environment" [ref=e942] [cursor=pointer]:
            - /url: https://learning.postman.com/docs/sending-requests/managing-environments/
          - text: for the GoCardless API collection by navigating to Environments and selecting the + icon to create a new environment.
        - paragraph [ref=e943]: <img src="https://content.pstmn.io/f6aa7ce1-78d4-4042-becd-25331e63739d/aW1hZ2UucG5n" alt="Creating%20a%20new%20Environment%20to%20store%20collection%20data" width="330" height="375">
        - paragraph [ref=e944]: "5\\. Navigate to an API call you'd like to test to save your key into the collection:"
        - paragraph [ref=e945]: "- With an API call open, click into \"Authorization\" - Expand the section - Paste in Copy the access token from _step 2_. - \"Save authorization to collection\" with the link"
        - paragraph [ref=e946]: <img src="https://content.pstmn.io/68f58aae-7057-44ec-b877-62d23dac4205/aW1hZ2UucG5n" alt="Save%20token%20to%20your%20Postman%20collection%20to%20execute%20calls" width="1608" height="746">
        - heading "Things to Note" [level=1] [ref=e947]
        - paragraph [ref=e948]:
